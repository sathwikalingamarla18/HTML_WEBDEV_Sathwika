<!DOCTYPE html>
<html>
<head>
     <title>List</title>
</head>
<body>
    <h3>unordered list</h3>
      <ul>
         <li>coffee</li>
         <li>Tea</li>
         <li>Milk</li>
      </ul>
    <h3>ordered list</h3>  
       <ol>
          <li>coffee</li>
          <li>Tea</li>
          <li>Milk</li>
       </ol>
    <h3>Descripition list</h3>
        <dl>
            <dt>coffee</dt>
            <dd>_black hot drink</dd>
            <dt>Tea</dt>
            <dd>_brown hot drink</dd>
            <dt>milk</dt>
            <dd>_white cold drink</dd>
       </dl>
</body>
</html>
